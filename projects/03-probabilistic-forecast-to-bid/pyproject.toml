[project]
name = "f2b"
version = "0.1.0"
description = "Probabilistic forecast-to-bid: distributional forecasting coupled to a trading policy for a German renewable portfolio"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=12"]

[project.optional-dependencies]
# The learned forecasters: F2 fits with scipy, F3 is LightGBM. The core (the decision layer
# and the parametric ablation) still installs from numpy and pandas alone, and the tests of
# F2/F3 skip without these.
forecast = ["scipy>=1.10", "lightgbm>=4.3,<5"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
