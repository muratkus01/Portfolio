[project]
name = "prosumer"
version = "0.1.0"
description = "15-minute prosumer PV+BESS energy management: benchmark ladder B1-B3 plus an RL environment, under the German tariff and regulatory framework"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pulp>=2.7",
    "requests>=2.28",
]

[project.optional-dependencies]
rl = ["gymnasium>=0.29", "stable-baselines3>=2.0", "torch>=2.0"]
data = ["pvlib>=0.10", "xlrd>=2.0", "pyarrow>=14"]
dev = ["pytest>=7.0", "ruff>=0.1", "xlrd>=2.0", "pvlib>=0.10"]

[project.scripts]
prosumer = "prosumer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
