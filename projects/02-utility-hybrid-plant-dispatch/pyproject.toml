[project]
name = "hybrid"
version = "0.1.0"
description = "Co-located wind + PV + battery plant dispatch under EEG direct marketing and a shared grid connection limit"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pulp>=2.7", "pyarrow>=12"]

[project.optional-dependencies]
rl = ["gymnasium>=0.29", "stable-baselines3>=2.0", "torch>=2.0"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
