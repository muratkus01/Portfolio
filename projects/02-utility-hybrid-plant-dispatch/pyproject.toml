[project]
name = "hybrid"
version = "0.1.0"
description = "Co-located wind + PV + battery plant dispatch under EEG direct marketing and a shared grid connection limit"
requires-python = ">=3.10"
# PuLP 3.2 or later: solve_window divides an LpVariable by a float, which 2.7 to 3.1 reject,
# and 4.0 removed LpVariable.dicts.
dependencies = ["numpy>=1.24", "pandas>=2.0", "pulp>=3.2,<4", "pyarrow>=12"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
