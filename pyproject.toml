[tool.pytest.ini_options]
minversion = "7.0"
# importlib mode: test directories are not packages, so identically named test files in
# different projects would otherwise collide at collection time.
addopts = "--import-mode=importlib"
filterwarnings = ["ignore::DeprecationWarning:pulp.*"]
testpaths = [
    "projects/01-prosumer-pv-bess-mpc-rl/tests",
    "projects/02-utility-hybrid-plant-dispatch/tests",
    "projects/03-probabilistic-forecast-to-bid/tests",
    # Archived 2026-10-09: no longer part of the portfolio, kept under test so the
    # history stays green and the code stays runnable. See archive/README.md.
    "archive/02-pumped-storage-rl-multimarket/tests",
    "archive/03-smart-ev-charging-14a/tests",
    "archive/04-energy-sharing-rec/tests",
]
pythonpath = [
    ".",
    "datakit",
    "projects/01-prosumer-pv-bess-mpc-rl/src",
    "projects/02-utility-hybrid-plant-dispatch/src",
    "projects/03-probabilistic-forecast-to-bid/src",
    # archived, see above
    "archive/02-pumped-storage-rl-multimarket/src",
    "archive/03-smart-ev-charging-14a/src",
    "archive/04-energy-sharing-rec/src",
]

[tool.coverage.run]
source = ["prosumer", "hybrid", "f2b", "psw", "evc", "rec"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
