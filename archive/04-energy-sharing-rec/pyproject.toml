[project]
name = "rec"
version = "0.1.0"
description = "Allocation mechanisms and legal regimes for German renewable energy communities"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
rl = ["gymnasium>=0.29", "pettingzoo>=1.24", "stable-baselines3>=2.0"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
