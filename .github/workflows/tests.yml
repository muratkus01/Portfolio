name: Tests

on:
  push:
    branches: [main, p01-thesis-extension]
  pull_request:
    branches: [main, p01-thesis-extension]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y coinor-cbc
          python -m pip install --upgrade pip
          pip install pytest pytest-cov gymnasium
          pip install -e "projects/01-prosumer-pv-bess-mpc-rl[dev]"
          pip install -e "projects/02-pumped-storage-rl-multimarket[dev]"
          pip install -e "projects/03-smart-ev-charging-14a[dev]"
          pip install -e "projects/04-energy-sharing-rec[dev]"
          pip install -e "projects/05-utility-hybrid-plant-dispatch[dev]"
          pip install -e "projects/06-probabilistic-forecast-to-bid[dev]"

      - name: Run full portfolio test suite
        run: |
          pytest -v
